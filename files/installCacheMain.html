<html manifest="../offline.cache">
<head>
<meta charset="utf-8">
<title>PS4 Exploit 7.00 - 9.60 v1.5.2 By Reza A.P</title>
<script>
function DLProgress(e){
    parent.ScrOverlay.style.display="block";
    var Percent = Math.round((e.loaded / e.total) * 100);
    parent.cacheUPDtxt.innerHTML = "Installing Offline Cache...";
    parent.CacheBar.style.width  = Percent + '%';
}

function DisplayCacheProgress(){
    setTimeout(function(){
        parent.cacheUPDtxt.innerHTML = "Cache Installed Successfully";
    }, 2000);
    setTimeout(function(){
        location.reload();
    }, 3000);
}

// Event handlers
window.applicationCache.addEventListener("progress", DLProgress, false);
window.applicationCache.oncached       = function(e){ DisplayCacheProgress(); };
window.applicationCache.onupdateready  = function(e){ DisplayCacheProgress(); };
window.applicationCache.onerror        = function(e){
    parent.cacheUPDtxt.innerHTML = "Error Installing Offline Cache";
};
</script>
</head>
<body>
</body>
</html>
